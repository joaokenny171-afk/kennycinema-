<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clientes - CinePlay</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topo">
    <div class="logo">🎬 Cine<span>Play</span></div>
    <nav>
      <a href="index.html">Início</a><a href="filmes.html">Filmes</a>
      <a href="clientes.html" class="ativo">Clientes</a><a href="locacoes.html">Locações</a><a href="contato.html">Contato</a>
    </nav>
  </header>

  <main class="container">
    <div class="cabecalho-pagina">
      <div><p class="tag">CLIENTES</p><h1>Cadastro de clientes</h1><p>Gerencie as pessoas que realizam locações.</p></div>
      <a href="index.html" class="btn btn-secundario">← Voltar</a>
    </div>

    <section class="form-card">
      <h2>Cadastrar cliente</h2>
      <form id="formCliente">
        <div class="grid-form">
          <label>Nome completo<input type="text" id="nome" required></label>
          <label>CPF<input type="text" id="cpf" maxlength="14" placeholder="000.000.000-00" required></label>
          <label>Telefone<input type="text" id="telefone" maxlength="15" placeholder="(00) 00000-0000" required></label>
          <label>E-mail<input type="email" id="email" required></label>
        </div>
        <button class="btn btn-principal" type="submit">Cadastrar cliente</button>
      </form>
    </section>

    <section class="lista">
      <h2>Clientes cadastrados</h2>
      <div id="listaClientes" class="tabela-container"></div>
    </section>
  </main>

  <footer>© 2026 CinePlay</footer>
  <script src="js/classes.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
